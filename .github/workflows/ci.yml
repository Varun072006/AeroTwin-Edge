name: AeroTwin Edge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ─── PYTHON LINT & TYPE CHECK ───────────────────────────────────────────────
  python-lint:
    name: Python — Ruff lint + mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml, edge, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt ruff mypy
      - name: Ruff lint
        run: ruff check ${{ matrix.service }}/
      - name: mypy type check
        run: mypy ${{ matrix.service }}/ --ignore-missing-imports

  # ─── TYPESCRIPT LINT & TYPE CHECK ──────────────────────────────────────────
  ts-lint:
    name: TypeScript — ESLint + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: cd web && npm ci
      - name: ESLint
        run: cd web && npm run lint
      - name: TypeScript type check
        run: cd web && npm run type-check

  # ─── ML PIPELINE TESTS ─────────────────────────────────────────────────────
  ml-tests:
    name: ML — Parity test + pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd ml
          pip install -r requirements.txt
      - name: Run ML tests
        run: pytest ml/ -v --tb=short -x
        # -x: stop on first failure (parity test must pass)

  # ─── EDGE SERVICE TESTS ────────────────────────────────────────────────────
  edge-tests:
    name: Edge — Offline + latency tests
    runs-on: ubuntu-latest
    needs: ml-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd edge
          pip install -r requirements.txt
      - name: Run edge tests
        run: pytest edge/ -v --tb=short
        # Includes: test_offline.py (60s offline → reconnect → zero event loss)
        # Includes: test_parity.py (ONNX max abs diff < 1e-3)
        # Includes: test_latency.py (p95 < 10 ms)

  # ─── API TESTS ─────────────────────────────────────────────────────────────
  api-tests:
    name: API — Endpoint + idempotency tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aerotwin
          POSTGRES_PASSWORD: aerotwin
          POSTGRES_DB: aerotwin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd api
          pip install -r requirements.txt
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://aerotwin:aerotwin@localhost:5432/aerotwin
        run: |
          cd api
          alembic upgrade head
      - name: Run API tests
        env:
          DATABASE_URL: postgresql://aerotwin:aerotwin@localhost:5432/aerotwin
        run: pytest api/ -v --tb=short

  # ─── FRONTEND TESTS ────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — Jest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: cd web && npm ci
      - name: Run Jest tests
        run: cd web && npm test -- --coverage --coverageThreshold='{"global":{"lines":70}}'

  # ─── OPENAPI VALIDATION ────────────────────────────────────────────────────
  openapi-validate:
    name: OpenAPI spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        uses: mbowman100/swagger-validator-action@master
        with:
          files: docs/openapi.yaml
